<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Skyward</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #cfe9f7; touch-action: none; user-select: none;
  }
  #wrap { position: fixed; inset: 0; display: block; }
  canvas { display: block; width: 100%; height: 100%; }
  #hint {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    font: 13px/1.4 "Comic Sans MS", "Segoe UI", sans-serif; color: #4a5b66;
    background: rgba(255,255,255,.72); padding: 5px 12px; border-radius: 999px;
    pointer-events: none; white-space: nowrap;
  }
  /* splash: shown for 2s, then fades into the game */
  #splash {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    background: #a4dcfe;
    transition: opacity .45s ease;
  }
  #splash.gone { opacity: 0; pointer-events: none; }
  #splash img {
    max-width: 100%; max-height: 100%;
    object-fit: contain; display: block;
  }
  #bar {
    position: absolute; bottom: 7%; left: 50%; transform: translateX(-50%);
    width: 180px; height: 12px; border: 2.5px solid #20303a; border-radius: 999px;
    background: rgba(255,255,255,.65); overflow: hidden;
  }
  #bar i {
    display: block; height: 100%; width: 0; background: #f7c948;
    animation: fill 2s linear forwards;
  }
  @keyframes fill { to { width: 100%; } }
  @media (prefers-reduced-motion: reduce) { #bar i { animation-duration: .01s; } }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="hint">← → or A/D &nbsp;·&nbsp; hold the on-screen buttons &nbsp;·&nbsp; tilt your phone &nbsp;·&nbsp; M to mute</div>
<div id="splash"><img id="splashimg" alt="Skyward"><div id="bar"><i></i></div></div>
<script>
(() => {
'use strict';

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const hint = document.getElementById('hint');

// ---------- world is a fixed logical size, letterboxed to fit ----------
const W = 480, H = 760;
let scale = 1, offX = 0, offY = 0;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const vw = window.innerWidth, vh = window.innerHeight;
  cv.width = Math.round(vw * dpr);
  cv.height = Math.round(vh * dpr);
  scale = Math.min(vw / W, vh / H);
  offX = (vw - W * scale) / 2;
  offY = (vh - H * scale) / 2;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);

// ---------- tunables ----------
const GRAV = 0.42;
const BOUNCE = -13.2;
const SPRING = -22.5;
const JET = -30;
const MOVE = 0.72, MAX_VX = 7.4, FRICTION = 0.86;
const PLAYER_R = 17;
const GAP_MIN = 62, GAP_MAX = 108;

const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[(Math.random() * arr.length) | 0];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

// ---------- game state ----------
let plats, clouds, enemies, player, cam, height, best, state, shake, particles, flash;
best = 0;
try { const s = localStorage.getItem('skyward_best'); if (s) best = +s || 0; } catch (e) {}

// keep the record even if the tab is closed mid-run, without writing every frame
let bestSaved = best, bestTick = 0;
function saveBest(force) {
  if (best === bestSaved) return;
  if (!force && ++bestTick % 30 !== 0) return;
  bestSaved = best;
  try { localStorage.setItem('skyward_best', String(best)); } catch (e) {}
}
addEventListener('pagehide', () => saveBest(true));

function makePlat(y, forced) {
  const kinds = height < 300
    ? ['normal', 'normal', 'normal', 'normal', 'move']
    : height < 900
      ? ['normal', 'normal', 'move', 'brittle', 'normal']
      : ['normal', 'move', 'brittle', 'move', 'brittle'];
  const kind = forced || pick(kinds);
  const w = kind === 'brittle' ? rand(62, 76) : rand(66, 88);
  const p = {
    x: rand(12, W - w - 12), y, w, h: 13, kind,
    dir: Math.random() < .5 ? -1 : 1,
    spd: rand(.7, 1.7) * (1 + Math.min(height / 2500, 1)),
    tilt: rand(-.05, .05),
    dead: false, fall: 0, used: false,
    bonus: null
  };
  // bonus riders
  const r = Math.random();
  if (kind !== 'brittle') {
    if (r < .055) p.bonus = { type: 'jet', t: 0 };
    else if (r < .16) p.bonus = { type: 'spring' };
  }
  return p;
}

function reset() {
  height = 0;
  cam = 0;
  shake = 0;
  flash = 0;
  particles = [];
  enemies = [];
  plats = [];
  clouds = [];

  // the grass is solid while you are still low, so an early miss is survivable.
  // it scrolls out of the world once you climb, and then there is no safety net.
  plats.push({ x: -20, y: H - 46, w: W + 40, h: 18, kind: 'ground', dir: 1, spd: 0, tilt: 0, dead: false, fall: 0, used: false, bonus: null });
  plats.push({ x: W / 2 - 45, y: H - 90, w: 90, h: 13, kind: 'normal', dir: 1, spd: 0, tilt: .02, dead: false, fall: 0, used: false, bonus: null });

  // first few rungs sit close together, then the spacing opens up
  let y = H - 90;
  for (let i = 0; i < 4; i++) { y -= rand(GAP_MIN - 8, GAP_MIN + 16); plats.push(makePlat(y, 'normal')); }
  while (y > -H) { y -= rand(GAP_MIN, GAP_MAX); plats.push(makePlat(y, Math.random() < .7 ? 'normal' : null)); }

  for (let i = 0; i < 9; i++) clouds.push({ x: rand(0, W), y: rand(-H, H), s: rand(.55, 1.25), o: rand(.35, .8) });

  player = { x: W / 2, y: H - 130, vx: 0, vy: BOUNCE, face: 1, jet: 0, squash: 0, alive: true };
  state = 'play';
  hint.style.opacity = '1';
}

// ---------- sound ----------
// Every effect is synthesized on the fly, so the page stays a single file
// with nothing to download and nothing to wait for.
const Sound = (() => {
  const AC = typeof window !== 'undefined' && (window.AudioContext || window.webkitAudioContext);
  const VOL = 0.5;
  let ac = null, master = null, noise = null;
  let muted = false;
  try { muted = localStorage.getItem('skyward_muted') === '1'; } catch (e) {}

  function init() {
    if (ac || !AC) return;
    try {
      ac = new AC();
      master = ac.createGain();
      master.gain.value = muted ? 0 : VOL;
      master.connect(ac.destination);
      // half a second of white noise, reused by every hiss and crack
      const len = Math.floor(ac.sampleRate * .5);
      noise = ac.createBuffer(1, len, ac.sampleRate);
      const d = noise.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { ac = null; }
  }

  // browsers keep audio muted until the player interacts, so wake it on any input
  function unlock() {
    init();
    if (ac && ac.state === 'suspended') { try { ac.resume(); } catch (e) {} }
  }

  function tone(o) {
    if (!ac || muted) return;
    const t = ac.currentTime + (o.at || 0);
    const osc = ac.createOscillator();
    const g = ac.createGain();
    osc.type = o.type || 'triangle';
    osc.frequency.setValueAtTime(o.f0, t);
    if (o.f1) osc.frequency.exponentialRampToValueAtTime(o.f1, t + (o.bend || o.dur));
    g.gain.setValueAtTime(.0001, t);
    g.gain.linearRampToValueAtTime(o.vol, t + .008);
    g.gain.exponentialRampToValueAtTime(.0001, t + o.dur);
    osc.connect(g); g.connect(master);
    osc.start(t); osc.stop(t + o.dur + .02);
  }

  function hiss(o) {
    if (!ac || muted) return;
    const t = ac.currentTime + (o.at || 0);
    const src = ac.createBufferSource();
    src.buffer = noise;
    const f = ac.createBiquadFilter();
    f.type = o.filter || 'bandpass';
    f.frequency.setValueAtTime(o.f0, t);
    if (o.f1) f.frequency.exponentialRampToValueAtTime(o.f1, t + o.dur);
    f.Q.value = o.q == null ? 1 : o.q;
    const g = ac.createGain();
    g.gain.setValueAtTime(.0001, t);
    g.gain.linearRampToValueAtTime(o.vol, t + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t + o.dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t); src.stop(t + o.dur + .02);
  }

  const S = {
    unlock,
    get muted() { return muted; },

    bounce(rise) {
      // the blip climbs in pitch as you do, so progress is something you can hear
      const k = 1 + clamp(rise / 3000, 0, 1) * .4;
      tone({ type: 'triangle', f0: 300 * k, f1: 640 * k, bend: .055, dur: .13, vol: .3 });
      tone({ type: 'sine', f0: 150 * k, f1: 300 * k, bend: .055, dur: .1, vol: .18 });
    },
    spring() {
      tone({ type: 'square', f0: 210, f1: 1040, bend: .16, dur: .26, vol: .15 });
      tone({ type: 'triangle', f0: 320, f1: 1560, bend: .19, dur: .3, vol: .2 });
    },
    jet() {
      hiss({ filter: 'bandpass', f0: 360, f1: 2700, q: 1.5, dur: .58, vol: .3 });
      tone({ type: 'sawtooth', f0: 120, f1: 540, bend: .5, dur: .58, vol: .11 });
    },
    crack() {
      hiss({ filter: 'highpass', f0: 1500, f1: 3400, q: .7, dur: .13, vol: .34 });
      tone({ type: 'square', f0: 190, f1: 70, bend: .1, dur: .13, vol: .13 });
    },
    stomp() {
      tone({ type: 'square', f0: 300, f1: 80, bend: .1, dur: .17, vol: .22 });
      hiss({ filter: 'lowpass', f0: 950, f1: 190, q: .6, dur: .15, vol: .24 });
    },
    over() {
      // four notes walking downhill: the sound of the run ending
      [523, 392, 294, 196].forEach((f, i) =>
        tone({ type: 'triangle', f0: f, dur: .32, vol: .22, at: i * .13 }));
    },

    toggle() {
      muted = !muted;
      if (!muted) unlock();
      if (master && ac) {
        const t = ac.currentTime;
        master.gain.cancelScheduledValues(t);
        master.gain.setTargetAtTime(muted ? 0 : VOL, t, .02);
      }
      try { localStorage.setItem('skyward_muted', muted ? '1' : '0'); } catch (e) {}
      if (!muted) S.bounce(0); // a small chirp, so you know sound is back
      return muted;
    }
  };
  return S;
})();

// ---------- input ----------
const keys = Object.create(null);
let touchDir = 0, tilt = 0;
const MUTE = { x: W / 2, y: 31, r: 20 };

addEventListener('keydown', e => {
  Sound.unlock();
  const k = e.key.toLowerCase();
  const held = keys[k]; // browsers repeat keydown while a key is held: only act on the first
  keys[k] = true;
  if (k === 'm' && !held) Sound.toggle();
  if ([' ', 'arrowleft', 'arrowright', 'arrowup', 'arrowdown'].includes(k)) e.preventDefault();
  if (state === 'over' && (e.key === ' ' || e.key === 'Enter')) reset();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

function toWorld(cx, cy) {
  return { x: (cx - offX) / scale, y: (cy - offY) / scale };
}

const BTN_R = 40, BTN_Y = H - 58, BTN_LX = 62, BTN_RX = W - 62;
const pointers = new Map();

function pointerDir(px, py) {
  const p = toWorld(px, py);
  if (Math.hypot(p.x - BTN_LX, p.y - BTN_Y) < BTN_R * 1.55) return -1;
  if (Math.hypot(p.x - BTN_RX, p.y - BTN_Y) < BTN_R * 1.55) return 1;
  return p.x < W / 2 ? -1 : 1;
}
function syncTouch() {
  let d = 0;
  for (const v of pointers.values()) d += v;
  touchDir = clamp(d, -1, 1);
}
cv.addEventListener('pointerdown', e => {
  Sound.unlock();
  const w = toWorld(e.clientX, e.clientY);
  // the speaker sits above everything else, so it works even on the game-over card
  if (Math.hypot(w.x - MUTE.x, w.y - MUTE.y) < MUTE.r + 8) { Sound.toggle(); return; }
  cv.setPointerCapture(e.pointerId);
  if (state === 'over') { reset(); return; }
  hint.style.opacity = '0';
  pointers.set(e.pointerId, pointerDir(e.clientX, e.clientY));
  syncTouch();
});
cv.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, pointerDir(e.clientX, e.clientY));
  syncTouch();
});
const drop = e => { pointers.delete(e.pointerId); syncTouch(); };
cv.addEventListener('pointerup', drop);
cv.addEventListener('pointercancel', drop);
addEventListener('blur', () => { pointers.clear(); touchDir = 0; });

addEventListener('deviceorientation', e => {
  if (e.gamma == null) return;
  tilt = clamp(e.gamma / 14, -1, 1);
}, true);

// ---------- particles ----------
function puff(x, y, n, col) {
  for (let i = 0; i < n; i++) {
    particles.push({
      x, y, vx: rand(-2.4, 2.4), vy: rand(-2.6, 1.4),
      r: rand(3, 9), life: 1, col: col || '#ffffff'
    });
  }
}
function shards(p) {
  for (let i = 0; i < 7; i++) {
    particles.push({
      x: p.x + rand(0, p.w), y: p.y + 6, vx: rand(-3, 3), vy: rand(-3.5, -.5),
      r: rand(4, 8), life: 1, col: '#e8622c', box: true
    });
  }
}

// ---------- enemies ----------
function overlapsPlatform(x, y, r) {
  for (const p of plats) {
    if (p.dead) continue;
    if (x + r > p.x - 6 && x - r < p.x + p.w + 6 && Math.abs(y - p.y) < r + p.h) return true;
  }
  return false;
}
function spawnEnemy(y) {
  // never leave a monster buried in a plank: try a few spots, else skip it
  for (let i = 0; i < 12; i++) {
    const x = rand(40, W - 40);
    if (!overlapsPlatform(x, y, 21)) {
      enemies.push({ x, y, dir: Math.random() < .5 ? -1 : 1, spd: rand(.6, 1.5), r: 21,
        t: rand(0, 6), squish: 0, dead: false, fall: 0 });
      return;
    }
  }
}

// ---------- update ----------
function update() {
  if (state !== 'play') {
    // let the player keep falling on the game-over screen
    player.vy += GRAV;
    player.y += player.vy;
    for (const q of particles) { q.x += q.vx; q.y += q.vy; q.vy += .18; q.life -= .022; }
    particles = particles.filter(q => q.life > 0);
    return;
  }

  // ---- horizontal control ----
  let dir = 0;
  if (keys['arrowleft'] || keys['a']) dir -= 1;
  if (keys['arrowright'] || keys['d']) dir += 1;
  if (dir === 0) dir = touchDir !== 0 ? touchDir : tilt;

  player.vx += dir * MOVE * (Math.abs(dir) > .15 ? 1 : 0);
  if (Math.abs(dir) < .15) player.vx *= FRICTION;
  player.vx = clamp(player.vx, -MAX_VX, MAX_VX);
  if (Math.abs(player.vx) > .4) player.face = player.vx > 0 ? 1 : -1;
  player.x += player.vx;

  // wrap around the sides
  if (player.x < -PLAYER_R) player.x = W + PLAYER_R;
  if (player.x > W + PLAYER_R) player.x = -PLAYER_R;

  // ---- vertical ----
  if (player.jet > 0) {
    player.jet--;
    player.vy = JET * .55;
    if (player.jet % 3 === 0) puff(player.x, player.y + PLAYER_R, 2, '#ffd9a0');
  } else {
    player.vy += GRAV;
  }
  player.y += player.vy;
  player.squash *= .84;

  // ---- platforms ----
  for (const p of plats) {
    if (p.kind === 'move' && !p.dead) {
      p.x += p.dir * p.spd;
      if (p.x < 8) { p.x = 8; p.dir = 1; }
      if (p.x + p.w > W - 8) { p.x = W - 8 - p.w; p.dir = -1; }
    }
    if (p.dead) { p.fall += 1.1; p.y += p.fall; p.tilt += .05; continue; }

    // land only while falling, and only if the ball was above the plank
    if (player.vy > 0) {
      const prevBottom = player.y - player.vy + PLAYER_R;
      const bottom = player.y + PLAYER_R;
      if (bottom >= p.y && prevBottom <= p.y + p.h + 2 &&
          player.x > p.x - PLAYER_R * .55 && player.x < p.x + p.w + PLAYER_R * .55) {

        if (p.bonus && p.bonus.type === 'spring') {
          player.vy = SPRING;
          p.bonus.fired = 12;
          puff(player.x, p.y, 8, '#c9a6ff');
          shake = 5;
          Sound.spring();
        } else if (p.bonus && p.bonus.type === 'jet') {
          player.jet = 42;
          player.vy = JET;
          p.bonus = null;
          shake = 8;
          flash = .5;
          Sound.jet();
        } else {
          player.vy = BOUNCE;
          // a brittle plank gets its own crack below; two sounds at once would muddy it
          if (p.kind !== 'brittle') Sound.bounce(height);
        }
        player.y = p.y - PLAYER_R;
        player.squash = 1;
        puff(player.x, p.y + 4, 3, '#ffffff');

        if (p.kind === 'brittle') { p.dead = true; shards(p); Sound.crack(); }
      }
    }
    if (p.bonus && p.bonus.fired > 0) p.bonus.fired--;
  }

  // ---- enemies ----
  for (const e of enemies) {
    if (e.dead) { e.fall += 1.2; e.y += e.fall; continue; }
    e.t += .05;
    e.x += e.dir * e.spd;
    if (e.x < 34) { e.x = 34; e.dir = 1; }
    if (e.x > W - 34) { e.x = W - 34; e.dir = -1; }
    e.squish *= .85;

    const d = Math.hypot(player.x - e.x, player.y - e.y);
    if (d < PLAYER_R + e.r - 5) {
      // stomp from above, or the jetpack plows through
      if (player.jet > 0 || (player.vy > 0 && player.y < e.y - e.r * .25)) {
        e.dead = true;
        e.squish = 1;
        if (player.jet <= 0) player.vy = BOUNCE * 1.12;
        puff(e.x, e.y, 10, '#8fd66a');
        shake = 6;
        Sound.stomp();
      } else {
        die();
      }
    }
  }

  // ---- camera follows upward only ----
  const line = H * .42;
  if (player.y - cam < line) {
    const dy = line - (player.y - cam);
    cam -= dy;
    height = Math.max(height, Math.round(-cam / 6));
    if (height > best) { best = height; saveBest(); }
  }

  // ---- recycle: drop what fell below, add new above ----
  plats = plats.filter(p => p.y - cam < H + 140);
  enemies = enemies.filter(e => e.y - cam < H + 140);

  let top = Infinity;
  for (const p of plats) if (p.y < top) top = p.y;
  if (!isFinite(top)) top = cam + H * .5; // never leave the ladder empty
  while (top > cam - H * .5) {
    const gapBoost = Math.min(height / 60, 26);
    top -= rand(GAP_MIN + gapBoost * .3, GAP_MAX + gapBoost);
    const np = makePlat(top);
    plats.push(np);
    if (height > 420 && Math.random() < .12) spawnEnemy(top - rand(40, 90));
  }
  // a plank spawned after a monster can still bury it: drop those, off-screen only
  enemies = enemies.filter(e =>
    e.dead || e.y - cam > -40 || !overlapsPlatform(e.x, e.y, e.r));

  for (const q of particles) { q.x += q.vx; q.y += q.vy; q.vy += .18; q.life -= .022; }
  // must come AFTER the decay: a spent particle would draw at a negative radius
  particles = particles.filter(q => q.life > 0);
  for (const cl of clouds) {
    if (cl.y - cam > H + 80) { cl.y -= H * 2 + rand(0, 200); cl.x = rand(0, W); }
  }

  if (shake > 0) shake *= .82;
  if (flash > 0) flash -= .04;

  // ---- fell off the bottom ----
  if (player.y - cam > H + PLAYER_R * 2) die();
}

function die() {
  if (state !== 'play') return;
  state = 'over';
  player.alive = false;
  player.vy = -6;
  shake = 10;
  puff(player.x, player.y, 14, '#ffd25e');
  Sound.over();
  if (height > best) best = height;
  saveBest(true);
}

// ---------- hand-drawn helpers ----------
const INK = '#20303a';
function sketchRect(x, y, w, h, r, fill, ink) {
  ctx.save();
  ctx.beginPath();
  const rr = Math.min(r, h / 2, w / 2);
  ctx.moveTo(x + rr, y);
  ctx.lineTo(x + w - rr, y + .6);
  ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
  ctx.lineTo(x + w - .6, y + h - rr);
  ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
  ctx.lineTo(x + rr, y + h - .5);
  ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
  ctx.lineTo(x + .5, y + rr);
  ctx.quadraticCurveTo(x, y, x + rr, y);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  ctx.lineWidth = 2.6; ctx.lineJoin = 'round';
  ctx.strokeStyle = ink || INK; ctx.stroke();
  ctx.restore();
}

function drawCloud(x, y, s, o) {
  ctx.save();
  ctx.translate(x, y); ctx.scale(s, s);
  ctx.globalAlpha = o;
  ctx.lineWidth = 2.2; ctx.strokeStyle = 'rgba(255,255,255,.95)';
  ctx.fillStyle = 'rgba(255,255,255,.5)';
  const blobs = [[-22, 4, 15], [-4, -6, 19], [16, 2, 14], [30, 8, 11]];
  for (const [bx, by, br] of blobs) {
    ctx.beginPath(); ctx.ellipse(bx, by, br, br * .78, 0, 0, 7); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}

function drawPlatform(p) {
  if (p.kind === 'ground') return; // the grass strip already draws it
  const y = p.y - cam;
  if (y < -60 || y > H + 80) return;
  ctx.save();
  ctx.translate(p.x + p.w / 2, y + p.h / 2);
  ctx.rotate(p.tilt);
  const fills = { normal: '#3f93a8', move: '#7b52d6', brittle: '#e8622c' };
  const tops  = { normal: '#57aec2', move: '#9873ea', brittle: '#f4834f' };
  sketchRect(-p.w / 2, -p.h / 2, p.w, p.h, 6, fills[p.kind]);
  ctx.beginPath();
  ctx.moveTo(-p.w / 2 + 6, -p.h / 2 + 3.5);
  ctx.lineTo(p.w / 2 - 8, -p.h / 2 + 3);
  ctx.strokeStyle = tops[p.kind]; ctx.lineWidth = 3; ctx.stroke();
  if (p.kind === 'brittle') {
    ctx.beginPath();
    ctx.moveTo(-6, -p.h / 2 + 2); ctx.lineTo(4, p.h / 2 - 2);
    ctx.strokeStyle = 'rgba(32,48,58,.75)'; ctx.lineWidth = 2; ctx.stroke();
  }
  ctx.restore();

  if (!p.bonus) return;
  if (p.bonus.type === 'spring') {
    const sx = p.x + p.w / 2, coils = p.bonus.fired > 0 ? 16 : 8;
    ctx.save();
    ctx.strokeStyle = INK; ctx.lineWidth = 2.4; ctx.beginPath();
    for (let i = 0; i <= 12; i++) {
      const t = i / 12;
      ctx.lineTo(sx + Math.sin(t * Math.PI * 3) * 6, y - t * coils);
    }
    ctx.stroke();
    sketchRect(sx - 9, y - coils - 6, 18, 6, 3, '#f2c14e');
    ctx.restore();
  } else if (p.bonus.type === 'jet') {
    const jx = p.x + p.w / 2 - 8;
    sketchRect(jx, y - 22, 16, 22, 5, '#d8dee3');
    ctx.beginPath();
    ctx.moveTo(jx + 4, y - 22); ctx.lineTo(jx + 4, y - 4);
    ctx.strokeStyle = '#98a4ad'; ctx.lineWidth = 2.2; ctx.stroke();
    sketchRect(jx + 2, y - 27, 12, 6, 3, '#e8622c');
  }
}

function drawEnemy(e) {
  const y = e.y - cam;
  if (y < -80 || y > H + 90) return;
  ctx.save();
  ctx.translate(e.x, y);
  const bob = e.dead ? 0 : Math.sin(e.t) * 3;
  ctx.translate(0, bob);
  if (e.dead) ctx.scale(1.25, .55);
  else if (e.squish > 0) ctx.scale(1 + e.squish * .2, 1 - e.squish * .2);

  ctx.beginPath();
  ctx.ellipse(0, 0, e.r, e.r * .86, 0, 0, 7);
  ctx.fillStyle = '#8fd66a'; ctx.fill();
  ctx.lineWidth = 2.8; ctx.strokeStyle = INK; ctx.stroke();
  // horns
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(s * 9, -e.r * .72);
    ctx.lineTo(s * 13, -e.r * 1.25);
    ctx.lineTo(s * 3, -e.r * .84);
    ctx.fillStyle = '#8fd66a'; ctx.fill(); ctx.stroke();
  }
  // face
  ctx.fillStyle = INK;
  if (e.dead) {
    ctx.lineWidth = 2.4;
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(s * 7 - 3, -5); ctx.lineTo(s * 7 + 3, 1);
      ctx.moveTo(s * 7 + 3, -5); ctx.lineTo(s * 7 - 3, 1);
      ctx.stroke();
    }
  } else {
    for (const s of [-1, 1]) {
      ctx.beginPath(); ctx.ellipse(s * 7, -3, 2.6, 3.2, 0, 0, 7); ctx.fill();
    }
    ctx.beginPath();
    ctx.moveTo(-6, 7); ctx.quadraticCurveTo(0, 12, 6, 7);
    ctx.lineWidth = 2.4; ctx.strokeStyle = INK; ctx.stroke();
  }
  ctx.restore();
}

function drawPlayer() {
  const y = player.y - cam;
  ctx.save();
  ctx.translate(player.x, y);

  // jetpack strapped on the back
  if (player.jet > 0) {
    ctx.save();
    ctx.translate(-player.face * 15, 2);
    sketchRect(-7, -12, 14, 20, 5, '#d8dee3');
    ctx.beginPath();
    ctx.moveTo(0, 8);
    ctx.quadraticCurveTo(rand(-5, 5), 20 + rand(0, 8), 0, 30 + rand(0, 6));
    ctx.quadraticCurveTo(rand(-5, 5), 18, 0, 8);
    ctx.fillStyle = '#f9a825'; ctx.fill();
    ctx.restore();
  }

  const sq = player.squash;
  ctx.scale(1 + sq * .22, 1 - sq * .22);

  // legs
  ctx.strokeStyle = INK; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
  const swing = player.vy < 0 ? -3 : 3;
  ctx.beginPath();
  ctx.moveTo(-6, PLAYER_R - 3); ctx.lineTo(-8 + swing, PLAYER_R + 9);
  ctx.moveTo(6, PLAYER_R - 3); ctx.lineTo(8 - swing, PLAYER_R + 9);
  ctx.stroke();

  // body
  ctx.beginPath();
  ctx.ellipse(0, 0, PLAYER_R, PLAYER_R * .98, 0, 0, 7);
  ctx.fillStyle = '#f7c948'; ctx.fill();
  ctx.lineWidth = 2.8; ctx.strokeStyle = INK; ctx.stroke();

  // face
  const ex = player.face * 2;
  ctx.fillStyle = INK;
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.ellipse(s * 6 + ex, -4, 2.2, state === 'over' ? 1 : 2.9, 0, 0, 7);
    ctx.fill();
  }
  ctx.beginPath();
  if (state === 'over') { ctx.moveTo(-5 + ex, 8); ctx.quadraticCurveTo(0 + ex, 3, 5 + ex, 8); }
  else { ctx.moveTo(-5 + ex, 5); ctx.quadraticCurveTo(0 + ex, 10, 5 + ex, 5); }
  ctx.lineWidth = 2.4; ctx.strokeStyle = INK; ctx.stroke();

  ctx.restore();
}

function badge(text, x, y, align) {
  ctx.font = '700 19px "Comic Sans MS", "Trebuchet MS", sans-serif';
  const w = ctx.measureText(text).width + 26;
  const bx = align === 'right' ? x - w : x;
  sketchRect(bx, y, w, 34, 9, '#fdf6e3');
  ctx.fillStyle = '#3b4a54';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(text, bx + 13, y + 18);
}

function drawButton(x, y, dir, active) {
  ctx.save();
  ctx.beginPath(); ctx.arc(x, y, BTN_R, 0, 7);
  ctx.fillStyle = active ? 'rgba(255,255,255,.95)' : 'rgba(255,255,255,.62)';
  ctx.fill();
  ctx.lineWidth = 2.8; ctx.strokeStyle = INK; ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x + dir * 11, y);
  ctx.lineTo(x - dir * 8, y - 12);
  ctx.lineTo(x - dir * 8, y + 12);
  ctx.closePath();
  ctx.fillStyle = INK; ctx.fill();
  ctx.restore();
}

function drawMute() {
  ctx.save();
  ctx.beginPath(); ctx.arc(MUTE.x, MUTE.y, MUTE.r, 0, 7);
  ctx.fillStyle = 'rgba(253,246,227,.92)'; ctx.fill();
  ctx.lineWidth = 2.6; ctx.strokeStyle = INK; ctx.stroke();

  const x = MUTE.x - 6, y = MUTE.y;
  ctx.fillStyle = INK;
  ctx.beginPath();
  ctx.moveTo(x - 3, y - 4); ctx.lineTo(x + 1, y - 4); ctx.lineTo(x + 6, y - 9);
  ctx.lineTo(x + 6, y + 9); ctx.lineTo(x + 1, y + 4); ctx.lineTo(x - 3, y + 4);
  ctx.closePath(); ctx.fill();

  ctx.lineWidth = 2.2; ctx.strokeStyle = INK; ctx.lineCap = 'round';
  if (Sound.muted) {
    ctx.beginPath();
    ctx.moveTo(x + 10, y - 5); ctx.lineTo(x + 18, y + 5);
    ctx.moveTo(x + 18, y - 5); ctx.lineTo(x + 10, y + 5);
    ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(x + 5, y, 8, -.85, .85); ctx.stroke();
    ctx.beginPath(); ctx.arc(x + 5, y, 13, -.75, .75); ctx.stroke();
  }
  ctx.restore();
}

function drawBackground() {
  // sky gets deeper the higher you climb
  const t = clamp(height / 1400, 0, 1);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, `rgb(${Math.round(150 - 82 * t)},${Math.round(210 - 60 * t)},${Math.round(240 - 10 * t)})`);
  g.addColorStop(1, `rgb(${Math.round(226 - 90 * t)},${Math.round(240 - 62 * t)},${Math.round(240 - 10 * t)})`);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // sun near the ground, fades as you rise
  const sunY = 90 - cam * .12;
  if (sunY < H + 90) {
    ctx.save();
    ctx.globalAlpha = clamp(1 - height / 500, 0, 1) * .85;
    ctx.beginPath(); ctx.arc(W - 78, sunY, 44, 0, 7);
    ctx.fillStyle = '#fdeaa8'; ctx.fill();
    ctx.restore();
  }

  for (const cl of clouds) drawCloud(cl.x, cl.y - cam * .35, cl.s, cl.o * clamp(1.2 - height / 2200, .15, 1));

  // grass strip at the very bottom of the world
  const gy = H - 46 - cam;
  if (gy < H + 60 && gy > -60) {
    ctx.fillStyle = '#9fd96b';
    ctx.fillRect(0, gy, W, H - gy + 60);
    ctx.strokeStyle = '#5faa3c'; ctx.lineWidth = 2.2;
    for (let i = 0; i < W; i += 16) {
      ctx.beginPath();
      ctx.moveTo(i, gy + 6); ctx.lineTo(i + 5, gy - 5); ctx.lineTo(i + 10, gy + 6);
      ctx.stroke();
    }
  }
}

function render() {
  const vw = window.innerWidth, vh = window.innerHeight;
  ctx.save();
  ctx.clearRect(0, 0, vw, vh);
  ctx.fillStyle = '#bfe0f0';
  ctx.fillRect(0, 0, vw, vh);
  ctx.translate(offX + (shake > .3 ? rand(-shake, shake) : 0), offY + (shake > .3 ? rand(-shake, shake) : 0));
  ctx.scale(scale, scale);
  ctx.beginPath(); ctx.rect(-4, -4, W + 8, H + 8); ctx.clip();

  drawBackground();
  for (const p of plats) drawPlatform(p);
  for (const e of enemies) drawEnemy(e);

  for (const q of particles) {
    ctx.globalAlpha = clamp(q.life, 0, 1);
    ctx.fillStyle = q.col;
    if (q.box) { ctx.fillRect(q.x - q.r / 2, q.y - q.r / 2, q.r, q.r); }
    else { ctx.beginPath(); ctx.arc(q.x, q.y, Math.max(0, q.r * q.life), 0, 7); ctx.fill(); }
  }
  ctx.globalAlpha = 1;

  drawPlayer();

  if (flash > 0) {
    ctx.fillStyle = `rgba(255,255,255,${flash * .5})`;
    ctx.fillRect(0, 0, W, H);
  }

  badge('Height: ' + height, 14, 14, 'left');
  badge('Best: ' + Math.max(best, height), W - 14, 14, 'right');
  drawButton(BTN_LX, BTN_Y, -1, touchDir < 0 || keys['arrowleft'] || keys['a']);
  drawButton(BTN_RX, BTN_Y, 1, touchDir > 0 || keys['arrowright'] || keys['d']);

  if (state === 'over') {
    ctx.fillStyle = 'rgba(20,32,40,.42)';
    ctx.fillRect(0, 0, W, H);
    const bw = 300, bh = 210, bx = (W - bw) / 2, by = H / 2 - bh / 2 - 20;
    sketchRect(bx, by, bw, bh, 18, '#fdf6e3');
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#3b4a54';
    ctx.font = '700 34px "Comic Sans MS", "Trebuchet MS", sans-serif';
    ctx.fillText('You fell!', W / 2, by + 46);
    ctx.font = '700 24px "Comic Sans MS", "Trebuchet MS", sans-serif';
    ctx.fillText('Height: ' + height, W / 2, by + 96);
    ctx.font = '600 18px "Comic Sans MS", "Trebuchet MS", sans-serif';
    ctx.fillStyle = height >= best && height > 0 ? '#d1741f' : '#6b7b85';
    ctx.fillText(height >= best && height > 0 ? '★ New best! ★' : 'Best: ' + best, W / 2, by + 128);
    sketchRect(W / 2 - 78, by + 152, 156, 40, 12, '#f7c948');
    ctx.fillStyle = '#3b4a54';
    ctx.font = '700 19px "Comic Sans MS", "Trebuchet MS", sans-serif';
    ctx.fillText('Play again', W / 2, by + 173);
  }

  // drawn last so it stays legible on top of the game-over card, matching the tap order
  drawMute();

  ctx.restore();
}

// ---------- fixed-step loop ----------
let acc = 0, last = performance.now();
function loop(now) {
  // book the next frame first: one bad frame must never freeze the game for good
  requestAnimationFrame(loop);
  let dt = now - last;
  last = now;
  // coming back from a background tab: resume cleanly instead of fast-forwarding
  if (dt > 120) { dt = 1000 / 60; acc = 0; }
  acc += dt;
  const STEP = 1000 / 60;
  let guard = 0;
  while (acc >= STEP && guard++ < 5) { update(); acc -= STEP; }
  render();
}

resize();
reset();
render(); // paint the first frame now, so it is ready behind the splash

// ---------- splash: hold for 2s, then fade into the game ----------
const splash = document.getElementById('splash');
let started = false;
function startGame() {
  if (started) return;
  started = true;
  if (splash) {
    splash.classList.add('gone');
    setTimeout(() => { if (splash.parentNode) splash.remove(); }, 500);
  }
  last = performance.now();
  acc = 0;
  requestAnimationFrame(loop);
}
setTimeout(startGame, 2000);
// impatient players can skip ahead; the guard makes repeat calls harmless.
// these also double as the gesture that wakes the audio engine.
addEventListener('pointerdown', () => { Sound.unlock(); startGame(); });
addEventListener('keydown', () => { Sound.unlock(); startGame(); });

// expose a tiny hook so the game can be poked from a test harness
window.__game = {
  get state() { return state; },
  get height() { return height; },
  get player() { return player; },
  get cam() { return cam; },
  reset, plats: () => plats, enemies: () => enemies, W, H, Sound, MUTE
};
})();
